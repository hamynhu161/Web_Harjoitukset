<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Calculator</title>
            <script src="script.js" defer ></script>
    </head>
    <body>
        <h1>Calculator</h1>
        <form>
            <label for="number1">Number 1</label>
            <input type="number" id="num1" placeholder="number1"><br><br>
            <label for="number 2">Number 2</label>
            <input type="number" id="num2" placeholder="number1"><br><br>
        </form>
        <button id="calculate+">+</button>
        <button id="calculate-">-</button>
        <button id="calculate*">*</button>
        <button id="calculate/">/</button>
        <p id="result">Result:</p>
    </body>
</html>
